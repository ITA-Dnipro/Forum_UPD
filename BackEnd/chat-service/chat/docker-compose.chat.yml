version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpass
    networks:
      - chat-network
  redis:
    image: redis:7
    container_name: redis
    command: [ "redis-server", "--maxclients", "1000", "--maxmemory-policy", "allkeys-lru" ]
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - chat-network

  chat-gunicorn:
    build: .
    command: gunicorn --pythonpath /app chat.wsgi:application --bind 0.0.0.0:8001
    volumes:
      - .:/app
    ports:
      - "8001:8001" # HTTP API
    environment:
      - DEBUG=${DEBUG}
      - SECRET_KEY=${SECRET_KEY}
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_DB_NAME=${MONGO_DB_NAME}
      - MONGO_USERNAME=${MONGO_USERNAME}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
    depends_on:
      - mongodb
      - redis
    networks:
      - chat-network

  chat-daphne:
    build: .
    command: daphne -b 0.0.0.0 -p 8002 chat.asgi:application
    volumes:
      - .:/app
    ports:
      - "8002:8002" # WebSocket
    environment:
      - DEBUG=${DEBUG}
      - SECRET_KEY=${SECRET_KEY}
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_DB_NAME=${MONGO_DB_NAME}
      - MONGO_USERNAME=${MONGO_USERNAME}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
    depends_on:
      - mongodb
      - redis
    networks:
      - chat-network

  krakend:
    image: devopsfaith/krakend
    container_name: krakend
    volumes:
      - ./krakend.json:/etc/krakend/krakend.json
    ports:
      - "8081:8080" # KrakenD exposed on host:8081
    command: [ "run", "-dc", "/etc/krakend/krakend.json" ]
    depends_on:
      - chat-gunicorn
      - chat-daphne
    networks:
      - chat-network

  kong:
    image: kong:3.6.1
    container_name: kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    volumes:
      - ./kong.yml:/etc/kong/kong.yml
    ports:
      - "8000:8000"   # HTTP traffic (host:container)
      - "8443:8443"   # HTTPS traffi
    networks:
      - chat-network
    depends_on:
      - chat-gunicorn
      - chat-daphne

networks:
  chat-network:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
