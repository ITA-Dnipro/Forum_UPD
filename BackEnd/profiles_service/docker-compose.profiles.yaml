services:
  db:
      image: postgres:14
      container_name: profiles_db
      restart: always
      environment:
        - POSTGRES_PASSWORD=${PROFILES_DB_PASSWORD}
        - POSTGRES_DB=${PROFILES_DB_NAME}
        - POSTGRES_USER=${PROFILES_DB_USER}
      ports:
        - "5434:5432"
      volumes:
        - profiles_data:/var/lib/postgresql/data
      networks:
      - forum_network

  profiles:
    build: .
    container_name: profiles_service
    depends_on:
      - db
    restart: on-failure
    environment:
      - PROFILES_DB_PASSWORD=${PROFILES_DB_PASSWORD}
      - PROFILES_DB_NAME=${PROFILES_DB_NAME}
      - PROFILES_DB_USER=${PROFILES_DB_USER}
      - PROFILES_DB_HOST=${PROFILES_DB_HOST}
      - PROFILES_DB_PORT=${PROFILES_DB_PORT}
    ports:
      - "8001:8000"
    volumes:
      - ./:/app
    networks:
      - forum_network

  redis:
    image: redis:alpine
    container_name: redis_container
    restart: unless-stopped
    ports: 
      -  "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - forum_network

  celery:
    build: .
    container_name: celery_container
    depends_on:
    - db
    - profiles
    - redis
    restart: unless-stopped
    command: celery --app=task.app worker --concurrency=1 --loglevel=DEBUG
    volumes:
      - ./:/app
    networks:
      - forum_network

volumes:
  profiles_data:
  redis_data:

networks:
  forum_network:
    external: true 
